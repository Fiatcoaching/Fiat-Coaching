<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiat Coaching — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow">Ad Maiorem Dei Gloriam</div>
    <h1>Fiat Coaching</h1>
    <p style="color: var(--ink-soft); font-size: 0.92rem;">
      Sign in to reach your session notes, homework, and resources.
    </p>
    <hr class="rule">

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
      <div class="auth-error" id="error-msg"></div>
    </form>

    <p style="font-size: 0.82rem; margin-top: 1.4em; color: var(--ink-soft);">
      Don't have login details yet? Ask Cassandra to set up your account.
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script>
  // If already signed in, skip straight to the dashboard.
  auth.onAuthStateChanged(function (user) {
    if (user) window.location.href = "dashboard.html";
  });

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error-msg");
    errorEl.textContent = "";

    auth.signInWithEmailAndPassword(email, password)
      .then(async function (cred) {
        // Route admins to the admin console, clients to their dashboard.
        const snap = await db.collection("users").doc(cred.user.uid).get();
        const role = snap.exists ? snap.data().role : "client";
        window.location.href = role === "admin" ? "admin.html" : "dashboard.html";
      })
      .catch(function (err) {
        errorEl.textContent = "Couldn't sign in — check your email and password and try again.";
        console.error(err);
      });
  });
</script>
</body>
</html>
