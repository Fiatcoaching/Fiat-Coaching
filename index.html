<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiat Coaching — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bone: #F7F2E9; --bone-dim: #EFE8D9; --ink: #332330; --ink-soft: #5C4C58;
  --gold: #B8863E; --gold-soft: #D9B77A; --burgundy: #7A2E3B;
  --sage: #6F7F5C; --sage-soft: #E4E9DC; --line: #DDD2BE; --white: #FFFDF9;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bone); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 2.4rem; margin: 0 0 0.4em 0; }
p { margin: 0 0 1em 0; max-width: 68ch; }
button { font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; padding: 0.65em 1.4em; border-radius: 3px; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--burgundy); color: var(--white); }
.btn-primary:hover { background: #602230; }
input { font-family: var(--font-body); font-size: 0.95rem; padding: 0.6em 0.8em; border: 1px solid var(--line); border-radius: 3px; background: var(--white); color: var(--ink); width: 100%; }
input:focus { outline: 2px solid var(--gold-soft); outline-offset: 1px; border-color: var(--gold); }
label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.3em; }
.field { margin-bottom: 1.1em; }
.rule { border: none; height: 1px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-soft) 40%, transparent 100%); margin: 1.4em 0; }
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.auth-card { background: var(--white); border: 1px solid var(--line); border-radius: 4px; padding: 2.6rem 2.4rem; max-width: 400px; width: 100%; }
.auth-eyebrow { color: var(--gold); font-family: var(--font-display); font-style: italic; font-size: 1.05rem; margin-bottom: 0.2em; }
.auth-error { color: var(--burgundy); font-size: 0.88rem; margin-top: 0.5em; min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow">Ad Maiorem Dei Gloriam</div>
    <h1>Fiat Coaching</h1>
    <p style="color: var(--ink-soft); font-size: 0.92rem;">
      Sign in to reach your session notes, homework, and resources.
    </p>
    <hr class="rule">

    <form id="login-form">
      <div class="field">
        <label for="username">Your name</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Sign in</button>
      <div class="auth-error" id="error-msg"></div>
    </form>

    <p style="font-size: 0.82rem; margin-top: 1.4em; color: var(--ink-soft);">
      Don't have login details yet? Ask Cassandra to set up your account.
    </p>
  </div>
</div>

<script src="js/clients-data.js"></script>
<script src="js/simple-auth.js"></script>
<script>
  if (getLoggedInClient()) window.location.href = "dashboard.html";

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error-msg");

    if (attemptLogin(username, password)) {
      window.location.href = "dashboard.html";
    } else {
      errorEl.textContent = "Couldn't sign in — check your name and password and try again.";
    }
  });
</script>
</body>
</html>
