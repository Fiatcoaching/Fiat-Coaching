<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Fiat Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bone: #F7F2E9; --bone-dim: #EFE8D9; --ink: #332330; --ink-soft: #5C4C58;
  --gold: #B8863E; --gold-soft: #D9B77A; --burgundy: #7A2E3B;
  --sage: #6F7F5C; --sage-soft: #E4E9DC; --line: #DDD2BE; --white: #FFFDF9;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bone); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; color: var(--ink); margin: 0 0 0.4em 0; }
h1 { font-size: 2.4rem; } h2 { font-size: 1.7rem; }
button { font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; padding: 0.65em 1.4em; border-radius: 3px; border: 1px solid transparent; cursor: pointer; }
.btn-secondary { background: transparent; color: var(--burgundy); border-color: var(--burgundy); }
.btn-secondary:hover { background: rgba(122,46,59,0.06); }
.rule { border: none; height: 1px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-soft) 40%, transparent 100%); margin: 1.4em 0; }
.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 230px; flex-shrink: 0; background: var(--ink); color: var(--bone); padding: 1.8rem 1.4rem; display: flex; flex-direction: column; }
.sidebar-brand { font-family: var(--font-display); font-size: 1.4rem; color: var(--white); margin-bottom: 0.1em; }
.sidebar-sub { font-size: 0.78rem; color: var(--gold-soft); margin-bottom: 1.8rem; }
.nav-item { display: block; padding: 0.6em 0.7em; border-radius: 3px; color: var(--bone-dim); font-size: 0.92rem; margin-bottom: 0.15em; text-decoration: none; }
.nav-item:hover { background: rgba(255,255,255,0.06); }
.nav-item.active { background: rgba(184,134,62,0.22); color: var(--white); border-left: 2px solid var(--gold); padding-left: calc(0.7em - 2px); }
.sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.12); }
.sidebar-name { font-size: 0.85rem; color: var(--bone-dim); margin-bottom: 0.5em; }
.main { flex: 1; padding: 2.6rem 3rem; max-width: 900px; }
.entry { background: var(--white); border: 1px solid var(--line); border-left: 3px solid var(--gold-soft); padding: 1.1rem 1.3rem; margin-bottom: 0.9rem; border-radius: 2px; }
.entry.done { border-left-color: var(--sage); background: var(--sage-soft); }
.entry-title { font-weight: 600; font-size: 1.02rem; margin-bottom: 0.15em; }
.entry-meta { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.5em; }
.entry-body { font-size: 0.94rem; color: var(--ink); white-space: pre-wrap; }
.empty-state { border: 1px dashed var(--line); padding: 2rem; text-align: center; color: var(--ink-soft); border-radius: 3px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4em; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.6rem; }
.practice-banner { background: var(--sage-soft); border-bottom: 1px solid var(--sage); color: var(--ink); padding: 0.55em 1.2em; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 1em; }
.practice-banner a { color: var(--burgundy); font-weight: 600; }
@media (max-width: 800px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 1rem 1.2rem; overflow-x: auto; }
  .sidebar-brand, .sidebar-sub, .sidebar-footer { display: none; }
  .nav-item { white-space: nowrap; margin-bottom: 0; margin-right: 0.3em; }
  .main { padding: 1.6rem 1.2rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="preview-banner"></div>

<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-brand">Fiat Coaching</div>
    <div class="sidebar-sub">Catholic Business Coaching</div>

    <a class="nav-item active" href="dashboard.html">Dashboard</a>
    <a class="nav-item" href="resources.html">Training Videos</a>
    <a class="nav-item" href="prayers.html">Prayers</a>

    <div class="sidebar-footer">
      <div class="sidebar-name" id="sidebar-name">Loading…</div>
      <button id="logout-btn" class="btn-secondary" style="width:100%;">Sign out</button>
    </div>
  </nav>

  <main class="main">
    <div class="top-bar">
      <h1 id="welcome-heading">Welcome</h1>
    </div>

    <section>
      <div class="section-head"><h2>Homework</h2></div>
      <div id="homework-list"></div>
    </section>

    <hr class="rule">

    <section>
      <div class="section-head"><h2>Session Notes</h2></div>
      <div id="notes-list"></div>
    </section>
  </main>
</div>

<script src="js/clients-data.js"></script>
<script src="js/simple-auth.js"></script>
<script>
const currentClient = requireClientLogin();
wireLogoutSimple("logout-btn");
renderPreviewBanner();

if (currentClient) {
  document.getElementById("sidebar-name").textContent = currentClient.name;
  document.getElementById("welcome-heading").textContent =
    "Welcome, " + currentClient.name.split(" ")[0];
  renderHomework();
  renderNotes();
}

function renderHomework() {
  const list = document.getElementById("homework-list");
  const items = currentClient.homework || [];
  if (!items.length) { list.innerHTML = '<div class="empty-state">No homework assigned yet.</div>'; return; }
  list.innerHTML = "";
  items.forEach(function (hw) {
    const el = document.createElement("div");
    el.className = "entry" + (hw.completed ? " done" : "");
    el.innerHTML =
      '<div class="entry-title">' + esc(hw.title) + (hw.completed ? " — done" : "") + "</div>" +
      '<div class="entry-meta">' + (hw.dueDate ? "Due " + esc(hw.dueDate) : "No due date") + "</div>" +
      '<div class="entry-body">' + esc(hw.description || "") + "</div>";
    list.appendChild(el);
  });
}

function renderNotes() {
  const list = document.getElementById("notes-list");
  const items = currentClient.sessionNotes || [];
  if (!items.length) { list.innerHTML = '<div class="empty-state">No session notes yet.</div>'; return; }
  list.innerHTML = "";
  items.forEach(function (note) {
    const el = document.createElement("div");
    el.className = "entry";
    el.innerHTML =
      '<div class="entry-title">' + esc(note.title) + "</div>" +
      '<div class="entry-meta">' + esc(note.date || "") + "</div>" +
      '<div class="entry-body">' + esc(note.content || "") + "</div>";
    list.appendChild(el);
  });
}

function esc(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}
</script>
</body>
</html>
